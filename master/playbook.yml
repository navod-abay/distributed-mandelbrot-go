- name: Run Clients
  hosts: client

  tasks:
    - name: Create Directory
      ansible.builtin.file:
        path: /home/ansible/mandelbrot
        state: directory

    - name: Copy the key file
      ansible.builtin.copy:
        src: /root/mandelbrot/private_key
        dest: /home/ansible/mandelbrot/private_key

    - name: Change file permissions (chmod 644)
      ansible.builtin.file:
        path: /home/ansible/mandelbrot/private_key
        state: file
        mode: '0600'

    - name: Install git
      ansible.builtin.apt:
        name: git 
        update_cache: yes
      become: yes

    - name: Add go repository
      ansible.builtin.apt_repository:
        repo: "deb http://deb.debian.org/debian bullseye-backports main"
        state: present
        filename: bullseye-backports
      become: true

    - name: Install go
      ansible.builtin.apt:
        name: golang-go
        target_package: "golang-go/bullseye-backports"
        update_cache: yes
      become: true

    - name: Clone the repo
      ansible.builtin.git:
        repo: git@github.com:navod-abay/distributed-mandelbrot-go.git
        dest: /home/ansible/mandelbrot/repo
        key_file: /home/ansible/mandelbrot/private_key   
        version: master
        accept_hostkey: true

    - name: Create Directory
      ansible.builtin.file:
        path: /home/ansible/mandelbrot/repo/build
        state: directory

    - name: Compile go
      ansible.builtin.command: 
        cmd: go build -o build/mandelbrotset .
        chdir: /home/ansible/mandelbrot/repo/client
    
    - name: run build
      ansible.builtin.command: 
        cmd: /home/ansible/mandelbrot/repo/build/mandelbrotset -protocolType=RPC -port=8080

- name: Run master
  hosts: localhost

  tasks:
    - name: build master
      ansible.builtin.command:
        cmd: go build -o build/mandelbrotset .
        chdir: /root/mandelbrot/master
    
    - name: run master
      ansible.builtin.command:
        cmd: ./build/mandelbrotset -protocolType=RPC
