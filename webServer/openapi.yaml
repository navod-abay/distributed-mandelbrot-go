openapi: 3.2.1
info:
  title: Mandelbrot Set API
  description: An API for generating Mandelbrot set images.
  version: 1.0.0

paths:
  /check-inclusion:
    get:
      summary: Check if a point is in the Mandelbrot set
      parameters:
        - name: X
          in: query
          description: The X coordinate of the point to check.
          required: true
          schema:
            type: number
        - name: Y
          in: query
          description: The Y coordinate of the point to check.
          required: true
          schema:
            type: number
      responses:
        '200':
          description: The result of the inclusion check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  num_iterations:
                    type: integer
                    description: The number of iterations it took to determine inclusion.